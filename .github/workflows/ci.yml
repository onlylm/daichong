name: validate

on:
  push:
    branches:
      - main
      - refactor/platform-rebuild
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Reject tracked secrets and runtime artifacts
        run: npm run check:repo

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run typecheck, tests, build and browser-script syntax check
        run: npm run check
