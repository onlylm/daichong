services:
  api:
    build: .
    command: ["node", "dist/server.js"]
    env_file: .env
    environment:
      HOST: 0.0.0.0
      STORAGE_DRIVER: sqlite
      SQLITE_PATH: /app/data/quefa-sandbox.sqlite
    ports:
      - "${SANDBOX_BIND_IP:-127.0.0.1}:3200:3200"
    volumes:
      - quefa_sandbox:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      STORAGE_DRIVER: sqlite
      SQLITE_PATH: /app/data/quefa-sandbox.sqlite
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - quefa_sandbox:/app/data
volumes:
  quefa_sandbox:
