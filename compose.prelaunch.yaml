# Private pre-domain deployment. Access only through an SSH tunnel.
version: "3.8"
x-runtime: &runtime
  image: recharge-platform:prelaunch
  env_file: /opt/recharge-platform/config/prelaunch.env
  environment:
    NODE_ENV: development
    HOST: 0.0.0.0
    PORT: 3200
    STORAGE_DRIVER: sqlite
    SQLITE_PATH: /app/data/prelaunch.sqlite
    PAYMENT_PROVIDER: mock
    FULFILLMENT_PROVIDER: mock
    LIVE_TEST_ENABLED: "false"
    ENABLE_SANDBOX_ROUTES: "false"
  volumes:
    - /opt/recharge-platform/state:/app/data
    - ./deploy:/app/deploy:ro
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  api:
    <<: *runtime
    build: .
    command: [node, dist/server.js]
    ports: ["127.0.0.1:3200:3200"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3200/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
  worker:
    <<: *runtime
    command: [node, dist/worker.js]
    depends_on:
      api: {condition: service_healthy}
